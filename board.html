:root{--night:#120a05;--panel:rgba(26,15,8,.84);--raise:#3a2617;--line:rgba(231,217,182,.24);--fg:#f0e4c8;--dim:#d7c8a4;--gold:#e3c075;--jade:#e3c075;--grn:#c99d48;--red:#e0705c;
 --f-carve:'Cinzel','Times New Roman',serif;--f-body:'Old Standard TT',Georgia,'Times New Roman',serif;--f-mono:'Old Standard TT',Georgia,'Times New Roman',serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#160d07 var(--tx-wood);background-size:1200px 600px;color:var(--fg);font-family:var(--f-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(90% 90% at 50% 40%,rgba(255,206,120,.1),rgba(0,0,0,.66) 100%);pointer-events:none}header,main,footer{z-index:1}header{position:relative}
header{display:flex;align-items:center;gap:26px;padding:14px 24px;border-bottom:1px solid var(--line)}
.brand{font:900 26px/1.1 var(--f-carve);letter-spacing:.04em}.brand small{display:block;font:500 12.5px/1.5 var(--f-body);letter-spacing:.05em;color:var(--dim)}
#code{font:600 13px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}#code b{display:block;font-size:30px;color:var(--gold);letter-spacing:.14em}
#count{font:600 15px/1.2 var(--f-mono);color:var(--jade)}
.sp{flex:1}
#clock{font:700 42px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#2c1c09;background:linear-gradient(180deg,#f0d692,#c99d48 46%,#a67a2c 56%,#d6b068);border:1px solid #5d3f14;border-radius:3px;padding:7px 12px 5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 9px rgba(0,0,0,.6);text-shadow:0 1px 0 rgba(255,236,190,.6)}
#start{appearance:none;border:1px solid #5d3f14;border-radius:3px;background:linear-gradient(180deg,#f0d692,#c99d48 46%,#a67a2c 56%,#d6b068);color:#2a1a08;font:700 21px/1 var(--f-mono);padding:14px 22px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 9px rgba(0,0,0,.6)}
#start:disabled{opacity:.4;cursor:default}
main{position:absolute;left:24px;right:24px;top:92px;bottom:34px}
#lobby{height:100%;display:grid;grid-template-columns:minmax(300px,31%) 1fr;gap:24px}
.join{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:0}
#qr{background:#fff;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.6);border-radius:6px;line-height:0}#qr img,#qr canvas{display:block;width:min(26vw,44vh);height:min(26vw,44vh);image-rendering:pixelated}
.join .u{font:500 clamp(13px,1.15vw,17px)/1.35 var(--f-mono);color:var(--dim);overflow-wrap:anywhere}.join .c{font:600 15px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}.join .c b{display:block;font-size:clamp(36px,4.5vw,64px);line-height:1.1;color:var(--gold);letter-spacing:.14em}
#names{display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;overflow:hidden}
.tile{background:#e7d9b7 var(--tx-paper);background-size:260px;color:#2b1e10;border:0;border-radius:1px;box-shadow:0 5px 14px rgba(0,0,0,.6);padding:12px 18px;font:900 clamp(18px,2vw,30px)/1.1 var(--f-carve);animation:pop .35s ease-out;cursor:pointer}.tile small{font:400 14px/1 var(--f-mono);color:#5f4f33;margin-left:8px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#empty{font:400 18px/1.5 var(--f-body);color:var(--dim)}
#race{position:absolute;inset:0;display:none}
.hd{position:absolute;left:0;right:0;top:0;height:22px;display:grid;grid-template-columns:44px minmax(150px,19vw) 1fr 64px 64px 92px;gap:12px;font:600 11px/22px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.pips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hd .pips span{text-align:center}
.row{position:absolute;left:0;right:0;display:grid;grid-template-columns:44px minmax(150px,19vw) 1fr 64px 64px 92px;gap:12px;align-items:center;background:var(--panel);border-radius:5px;padding:0 10px 0 0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;will-change:transform;cursor:pointer}
.row .rk{font:600 18px/1 var(--f-mono);text-align:right;color:var(--dim)}
.row .nm{font:900 clamp(14px,1.55vw,20px)/1 var(--f-carve);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pips i{display:block;height:58%;min-height:10px;border-radius:2px;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(231,199,126,.2);transition:background .4s,box-shadow .4s}
.row .pips{height:100%;align-items:center}
.row .pips i.on{background:linear-gradient(180deg,#f0d692,#a67a2c)}.row .pips i.now{background:#f6e5b3;box-shadow:0 0 12px #f0d692}
.row .tr{font:400 14px/1 var(--f-mono);color:var(--dim);text-align:right}.row .tm{font:600 17px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.row.done{background:#e7d9b7 var(--tx-paper);background-size:260px;color:#2b1e10}.row.done .rk,.row.done .tr{color:#5f4f33}.row.g1{box-shadow:inset 4px 0 0 var(--gold)}.row.g2{box-shadow:inset 4px 0 0 #cfd6da}.row.g3{box-shadow:inset 4px 0 0 #c98a55}
.row.off{opacity:.5}
footer{position:absolute;left:24px;right:24px;bottom:8px;font:400 12px/1.4 var(--f-mono);color:var(--dim);display:flex;justify-content:space-between}
#fresh{appearance:none;background:none;border:0;color:var(--dim);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
#debrief{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:22px}.dbl{display:grid;grid-template-rows:repeat(7,1fr);gap:7px;min-height:0}
.dbr{display:grid;grid-template-columns:minmax(170px,24%) 1fr 84px;gap:12px;align-items:center;background:var(--panel);border-radius:3px;padding:0 12px}.dbr b{font:900 clamp(14px,1.5vw,20px)/1.15 var(--f-carve)}.dbr small{display:block;font:italic 400 clamp(13px,1.05vw,16px)/1.25 var(--f-mono);color:var(--dim)}.dbr.top{background:#e7d9b7 var(--tx-paper);background-size:260px;color:#2b1e10}.dbr.top small{color:#5f4f33}
.bar{height:58%;min-height:12px;background:rgba(0,0,0,.42);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(180deg,#f0d692,#a67a2c)}.dbr.top .bar i{background:linear-gradient(180deg,#b84030,#7d1a12)}.dbr span{font:700 clamp(16px,1.5vw,22px)/1.1 var(--f-mono);text-align:right}.dbr span small{font:400 12.5px/1.15 var(--f-mono)}
.ask{background:#e7d9b7 var(--tx-paper);background-size:300px;color:#2b1e10;box-shadow:0 8px 24px rgba(0,0,0,.65);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}.ask h3{margin:0;font:italic 400 18px/1.2 var(--f-mono)}.ask p{margin:0;font:400 clamp(21px,2.3vw,34px)/1.28 var(--f-mono)}.ask small{font:400 16px/1.3 var(--f-mono);color:#5f4f33}
.fbt{display:grid;gap:6px;border-top:1px solid rgba(43,30,16,.45);padding-top:12px}.fbt small{font-size:clamp(16px,1.35vw,20px)}
.fbtn{appearance:none;background:rgba(26,15,8,.8);border:1px solid rgba(231,199,126,.5);border-radius:3px;color:var(--fg);font:400 14px/1 var(--f-mono);padding:6px 11px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.row{transition:none}.tile{animation:none}}
</style>
</head>

<header>
 <div class="brand">Project Vitruvius<small>ESS3805 · Dr Naser Taleshi</small></div>
 <div id="code">Room<b id="rc"></b></div><div id="count"></div><div class="sp"></div>

<script src="libs/qrcode.min.js"></script>
<script>
const qs=new URLSearchParams(location.search),BASE=qs.get('db')||'https://colossus-ess3805-default-rtdb.europe-west1.firebasedatabase.app',LIMIT=900,TEST=qs.has('test'),WHERE=['Toe','Foot','Ankle','Shank','Knee','Thigh','Hip'];
const LVL=[['sheet','Toe','Inverse Dynamics: Requirements','Which inputs do the force plate and the cameras give you, and which must you calculate?'],['com','Foot','Segment Centre of Mass','Why start at the hip and not the knee? What does 0.433 mean on the thigh?'],['film','Ankle','Segment CoM Linear Acceleration','Why does the formula need three frames, and what happens at frame 1?'],['dial','Shank','Segment Angular Acceleration','Why did the angle need vRef, and why does the foot angle need a sign?'],['scale','Knee','Segment Mass','Why can nobody weigh a thigh, and where does the fraction come from?'],['pend','Thigh','Segment Moment of Inertia','What does R tell you about the thigh, and why is it squared?'],['term','Hip','Segment Centre of Mass','The machine finished every sum without a fault. How did you know that its answer was wrong?']];
const WORDS=['KNEE','FOOT','SHIN','TOES','HEEL','GAIT','STEP','HIPS'];
const newCode=()=>WORDS[Math.floor(Math.random()*WORDS.length)]+String(10+Math.floor(Math.random()*90));
let ROOM=(qs.get('room')||'').toUpperCase();
if(!ROOM){ROOM=newCode();qs.set('room',ROOM);history.replaceState(null,'','?'+qs)}
const HOME=ROOM,$=s=>document.querySelector(s),url=p=>`${BASE}/sessions/${ROOM}${p}.json`,home=p=>`${BASE}/sessions/${HOME}${p}.json`;
const JOIN=new URL('./?room='+ROOM,location.href).href;
let D={meta:null,teams:{}},offset=0,queued=false;const rows={},tiles={},lat=[];
$('#rc').textContent=ROOM;$('#jc').textContent=ROOM;$('#ju').textContent=JOIN.replace(/^https?:\/\//,'');$('#hp').innerHTML=WHERE.map(w=>`<span>${w}</span>`).join('');
try{new QRCode($('#qr'),{text:JOIN,width:420,height:420,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').style.display='none'}
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function apply(ev,merge){
  const seg=ev.path.split('/').filter(Boolean);
  if(!seg.length){if(merge)Object.assign(D,ev.data);else D=Object.assign({meta:null,teams:{}},ev.data||{})}
  else{let n=D;for(const s of seg.slice(0,-1)){if(!n[s]||typeof n[s]!=='object')n[s]={};n=n[s]}const k=seg[seg.length-1];if(merge){if(!n[k]||typeof n[k]!=='object')n[k]={};Object.assign(n[k],ev.data)}else n[k]=ev.data}
  if(ev.data&&ev.data.ts){const l=Date.now()-ev.data.ts;if(l>=0&&l<60000)lat.push(l)}
  if(!queued){queued=true;setTimeout(()=>{queued=false;render()},60)}
}
const serverNow=()=>Date.now()+offset,stopAt=()=>(D.clock&&D.clock.stopAt)||0;
function groups(){const T=D.teams||{};return Object.keys(T).map(k=>{const t=T[k]||{},ds=Object.values(t.d||{}).filter(d=>d&&typeof d==='object');let b=null;
    for(const d of ds){const nd=d.done||0,nb=b&&(b.done||0);if(!b||nd>nb||(nd===nb&&((d.n||0)>(b.n||0)||((d.n||0)===(b.n||0)&&(d.pa||9e15)<(b.pa||9e15)))))b=d}
    return Object.assign({},b||{},{k,name:t.hide?'Hidden name':(t.name||'...'),raw:t.name,hide:t.hide,devs:ds.length,last:Math.max(0,...ds.map(d=>d.at||0))})}).filter(g=>g.devs).sort((a,b)=>(b.done||0)-(a.done||0)||(b.n||0)-(a.n||0)||((a.pa||9e15)+(a.pen||0)*1000)-((b.pa||9e15)+(b.pen||0)*1000)||String(a.name).localeCompare(b.name))}
function hideName(g){if(!g||g.hide)return;if(confirm(`Hide the name "${g.raw}" on this screen?`))fetch(url('/teams/'+g.k),{method:'PATCH',body:JSON.stringify({hide:1})})}
function render(){
  const G=groups(),started=!!(D.meta&&D.meta.startAt),devs=G.reduce((a,g)=>a+g.devs,0);
  $('#count').textContent=started?`${G.filter(g=>g.done).length} of ${G.length} groups out`:`${G.length} ${G.length===1?'group':'groups'} in · ${devs} ${devs===1?'device':'devices'}`;
  $('#start').style.display=started?'none':'';$('#start').disabled=!G.length;$('#fresh').style.display=started?'none':'';$('#restart').hidden=!started&&!G.length;$('#fbb').hidden=!started;if(stopAt()){$('#fbb').disabled=true;$('#fbb').textContent='Game stopped'}
  $('#lobby').style.display=started?'none':'grid';$('#race').style.display=started?'block':'none';
  if(!started){$('#empty').style.display=G.length?'none':'';G.forEach(g=>{let t=tiles[g.k];if(!t){t=tiles[g.k]=document.createElement('div');t.className='tile';t.onclick=()=>hideName(groups().find(x=>x.k===g.k));$('#names').appendChild(t)}t.textContent=g.name;const s=document.createElement('small');s.textContent=g.devs>1?'× '+g.devs:'';t.appendChild(s)});return}
  $('#dbb').hidden=false;if(DB){debrief(G);return}
  const H=$('#race').clientHeight-26,rh=Math.max(20,Math.min(64,H/Math.max(G.length,1))),gap=Math.min(5,rh*.12);
  G.forEach((g,i)=>{let r=rows[g.k];if(!r){r=rows[g.k]=document.createElement('div');r.innerHTML=`<span class="rk"></span><span class="nm"></span><div class="pips">${WHERE.map(()=>'<i></i>').join('')}</div><span class="tr"></span><span class="tr"></span><span class="tm"></span>`;r.onclick=()=>hideName(groups().find(x=>x.k===g.k));$('#race').appendChild(r)}
    r.className='row'+(g.done?' done':'')+(g.done&&i<3?' g'+(i+1):'')+(!g.done&&serverNow()-(g.last||0)>45000?' off':'');r.style.height=(rh-gap)+'px';r.style.transform=`translateY(${26+i*rh}px)`;
    r.children[0].textContent=i+1;r.children[1].textContent=g.name;[...r.children[2].children].forEach((p,k)=>{const n=g.n||0;p.className=k<n?'on':k===n&&!g.done?'now':''});
    r.children[3].textContent=g.wrong||0;r.children[4].textContent=g.pen?'+'+Math.round(g.pen/60)+' min':'';r.children[5].textContent=fmt(((g.done?g.pa:Math.min(stopAt()||9e15,Math.max(g.pa||0,serverNow())))-D.meta.startAt)/1000+(g.pen||0))});
}
let DB=false;
function debrief(G){const R=LVL.map(([id,w,sl,q])=>{let n=0,h=0;G.forEach(g=>{const s=g.st||{},t=s.hint||{};n+=(s.wrong&&s.wrong[id])||0;Object.keys(t).forEach(k=>{if(k.startsWith(id+'_'))h+=t[k]})});return {id,w,sl,q,n,h,s:n+h*2}}),mx=Math.max(1,...R.map(r=>r.s)),top=R.reduce((a,b)=>b.s>a.s?b:a,R[0]);
  $('#dbl').innerHTML=R.map(r=>`<div class="dbr ${r===top&&top.s?'top':''}"><div><b>${r.w}</b><small>${r.sl}</small></div><div class="bar"><i style="width:${Math.round(100*r.s/mx)}%"></i></div><span>${r.n}<small> wrong<br>${r.h} hints</small></span></div>`).join('');
  $('#ask').innerHTML=`<h3>${top.s?'Ask the room about the '+top.w:'No wrong tries yet'}</h3><p>${top.q}</p><small>Lecture slide: ${top.sl}</small>${fbHTML()}`}
function fbHTML(){const A=[[0,0,0],[0,0,0]];let n=0;Object.values(D.teams||{}).forEach(t=>Object.values(t&&t.d||{}).forEach(d=>{const f=d&&d.fb;if(!f)return;n++;if([0,1,2].includes(f.like))A[0][f.like]++;if([0,1,2].includes(f.again))A[1][f.again]++}));
  return n?`<div class="fbt"><h3>Feedback from ${n} ${n===1?'device':'devices'}</h3><small>Enjoyed it: <b>${A[0][2]}</b> very much, <b>${A[0][1]}</b> OK, <b>${A[0][0]}</b> not really</small><small>Another game: <b>${A[1][2]}</b> yes, <b>${A[1][1]}</b> maybe, <b>${A[1][0]}</b> no</small></div>`:''}
$('#dbb').onclick=()=>{DB=!DB;$('#dbb').textContent=DB?'Leaderboard':'Debrief';$('#race').style.visibility=DB?'hidden':'';$('#debrief').style.display=DB?'grid':'none';render()};
setInterval(()=>{const m=D.meta;if(m&&m.startAt){const G=groups(),end=stopAt()||(G.length&&G.every(g=>g.done)?Math.max(...G.map(g=>g.pa||0)):serverNow());$('#clock').textContent=fmt((end-m.startAt)/1000);render()}
  if(TEST&&lat.length){const a=[...lat].sort((x,y)=>x-y);$('#fl').textContent=`Test: ${a.length} updates, delay median ${a[a.length>>1]} ms, slowest ${a[a.length-1]} ms`}},500);
$('#start').onclick=()=>{$('#start').disabled=true;fetch(url('/meta'),{method:'PATCH',body:JSON.stringify({startAt:{'.sv':'timestamp'}})})};
$('#restart').onclick=async()=>{if(!confirm('Restart the game? Every group goes back to the opening screen. The room code and QR stay the same.'))return;$('#restart').disabled=true;const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=()=>C[Math.floor(Math.random()*C.length)],nx=HOME.slice(0,4).padEnd(4,'X')+r()+r();await fetch(`${BASE}/sessions/${nx}/meta.json`,{method:'PUT',body:JSON.stringify({created:{'.sv':'timestamp'},limit:LIMIT})});await fetch(home('/clock'),{method:'PUT',body:JSON.stringify({t:{'.sv':'timestamp'},next:nx})});location.reload()};
$('#fbb').onclick=async()=>{if(!confirm('Stop the game? The clock stops here and on the phones, and the two questions go to every phone within about 10 seconds.'))return;const b=$('#fbb'),p=JSON.stringify({ask:ROOM,stopAt:{'.sv':'timestamp'}});b.disabled=true;await fetch(home('/clock'),{method:'PATCH',body:p});if(ROOM!==HOME)await fetch(url('/clock'),{method:'PATCH',body:p})};
$('#fresh').onclick=()=>{if(confirm('Open a new empty room? Use this if you need to run the game again.')){qs.set('room',newCode());location.search=qs}};
window.__lat=()=>{const a=[...lat].sort((x,y)=>x-y);return {n:a.length,median:a[a.length>>1]||0,p95:a[Math.floor(a.length*.95)]||0,max:a[a.length-1]||0}};
(async()=>{try{const c=await (await fetch(home('/clock'))).json();if(c&&c.next)ROOM=c.next}catch(e){}try{const t=Date.now(),p=await fetch(url('/clock'),{method:'PATCH',body:JSON.stringify({t:{'.sv':'timestamp'}})}),j=await p.json();if(typeof j.t==='number')offset=j.t-(t+Date.now())/2}catch(e){}
 const r=await fetch(url('/meta')),m=await r.json();if(!m)await fetch(url('/meta'),{method:'PUT',body:JSON.stringify({created:{'.sv':'timestamp'},limit:LIMIT})});
 const es=new EventSource(url(''));es.addEventListener('put',e=>apply(JSON.parse(e.data),false));es.addEventListener('patch',e=>apply(JSON.parse(e.data),true))})();
</script>
</body>
